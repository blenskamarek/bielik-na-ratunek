# Pola potwierdzenia przelewu, które model może uzupełnić, gdy reguły ich nie znalazły.
opis_dokumentu: Potwierdzenie wykonania przelewu bankowego (np. wpis od odwołania lub opłata skarbowa).

fragmenty:
  - {od: '\A', znakow: 5000}

pola:
  przelew_bankowy.data_operacji: {typ: data, opis: Data wykonania operacji (nie data wydruku).}
  przelew_bankowy.kwota: {typ: kwota, opis: Kwota przelewu.}
  # typ rachunek: zapis bez spacji, kod kraju (PL) tylko gdy jest w dokumencie - ustala go program z tekstu
  przelew_bankowy.z_rachunku: {typ: rachunek, opis: Numer rachunku nadawcy.}
  przelew_bankowy.na_rachunek: {typ: rachunek, opis: Numer rachunku odbiorcy.}
  przelew_bankowy.numer_transakcji: {typ: tekst, opis: Numer referencyjny / identyfikator transakcji.}
  przelew_bankowy.tytul: {typ: tekst, opis: Tytuł przelewu, dosłownie.}
